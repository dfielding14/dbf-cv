name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests

  build-pdfs:
    if: ${{ secrets.ADS_DEV_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra
      - name: Build bundled-font PDFs
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
        run: python -m fielding_cv build --font-profile bundled
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: fielding-cv-pdfs
          path: output/pdf/*.pdf
