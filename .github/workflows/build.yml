name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests

  build-pdfs:
    runs-on: ubuntu-latest
    env:
      ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install TeX dependencies
        if: env.ADS_DEV_KEY != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra
      - name: Build bundled-font PDFs
        if: env.ADS_DEV_KEY != ''
        run: python -m dbf_cv build --font-profile bundled
      - name: Upload PDFs
        if: env.ADS_DEV_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: dbf-cv-pdfs
          path: output/pdf/*.pdf
      - name: Skip PDF build
        if: env.ADS_DEV_KEY == ''
        run: echo "ADS_DEV_KEY is not configured; skipping PDF build."
